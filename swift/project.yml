name: WalkBuddy
options:
  bundleIdPrefix: com.walkbuddy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: F87457F436
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  WalkBuddy:
    type: application
    platform: iOS
    sources:
      - path: WalkBuddy/Sources
      - path: WalkBuddy/Shared
      - path: WalkBuddy/Resources
        buildPhase: resources
    dependencies:
      - target: WalkBuddyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkbuddy.app.F87457F436
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: WalkBuddy/Info.plist
      properties:
        CFBundleDisplayName: WalkBuddy
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location]
        NSLocationAlwaysAndWhenInUseUsageDescription: During a walk WalkBuddy keeps sharing your location with the screen locked so your friends can find you.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [walkbuddy]
        UIAppFonts:
          - BricolageGrotesque_800ExtraBold.ttf
          - BricolageGrotesque_700Bold.ttf
          - Figtree_500Medium.ttf
          - Figtree_600SemiBold.ttf
          - Figtree_700Bold.ttf
        NSLocationWhenInUseUsageDescription: WalkBuddy shares your location during a walk so your friends can find you if you stop answering.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WBDefaultServer: https://organised-searched-debug-creator.trycloudflare.com
  WalkBuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WalkBuddyWidgets
      - path: WalkBuddy/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkbuddy.app.F87457F436.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: WalkBuddyWidgets/Info.plist
      properties:
        CFBundleDisplayName: WalkBuddy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WalkBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WalkBuddyUITests
    dependencies:
      - target: WalkBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkbuddy.app.F87457F436.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WalkBuddy
schemes:
  WalkBuddy:
    build:
      targets:
        WalkBuddy: all
        WalkBuddyWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkBuddyUITests
